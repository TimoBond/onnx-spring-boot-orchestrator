
apiVersion: v1
kind: ServiceAccount
metadata:
  name: onnx-orchestrator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scale-deployments
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: onnx-orchestrator-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: onnx-orchestrator
roleRef:
  kind: Role
  name: scale-deployments
  apiGroup: rbac.authorization.k8s.io