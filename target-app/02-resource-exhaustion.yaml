
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-memory-exhaustion
  namespace: default
spec:
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: target-app
  stressors:
    cpu:
      workers: 1
      load: 30                
  duration: "300s"


apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: dependency-pod-failure
  namespace: default
spec:
  action: pod-failure
  mode: fixed
  value: "1"
  selector:
    namespaces:
      - default
    labelSelectors:
      app: downstream-dependency
  duration: "60s"
